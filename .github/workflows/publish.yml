name: "Publish to PyPI"

"on":
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: snok/install-poetry@v1
        with:
          version: 1.8.3

      # A release tagged v2.4.0 must not publish a differently-versioned
      # artifact, so fail loudly rather than uploading a surprise.
      - name: Verify the tag matches the project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          project_version="$(poetry version --short)"
          tag_version="${RELEASE_TAG#v}"
          if [ "$project_version" != "$tag_version" ]; then
            echo "Tag ${tag_version} does not match pyproject version ${project_version}" >&2
            exit 1
          fi

      - run: poetry build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing. No API token is stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
