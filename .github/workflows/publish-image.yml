name: "Publish Image to GHCR"

"on":
  release:
    types: [published]
  # Build without pushing on pull requests, so a broken Dockerfile is
  # caught in review rather than at release time.
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "poetry.lock"
      - "barbara/**"
      - ".github/workflows/publish-image.yml"

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR. Authentication uses the built-in
      # GITHUB_TOKEN, so no registry credentials are stored.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
